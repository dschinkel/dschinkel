<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DAVE SCHINKEL GitHub Profile Banner</title>
  <desc id="desc">CRT Monitor banner (mono palette) — Phosphor glow, scanlines and an ASCII coffee cup on a curved screen.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="28"/></clipPath>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity="0.28"/></pattern>
<radialGradient id="screen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 150) scale(640 220)"><stop stop-color="#1A1A1A"/><stop offset="1" stop-color="#0A0A0A"/></radialGradient>
<radialGradient id="vig" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 150) scale(640 200)"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.65"/></radialGradient>
<filter id="phos" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#frame)">
<rect width="1200" height="300" fill="#050505"/>
<rect x="22" y="16" width="1156" height="268" rx="44" fill="url(#screen)" stroke="#2E2E2E" stroke-width="3"/>
<g filter="url(#phos)"><animate attributeName="opacity" values="1;.93;1;.97;1" dur="3.2s" repeatCount="indefinite"/><text x="80" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" fill="#FFFFFF">&gt; AGENTIC ENGINEERING LAB</text>
<text x="78" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="60" font-weight="800" fill="#FFFFFF">DAVE SCHINKEL</text>
<text x="80" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" fill="#FFFFFF" fill-opacity="0.8">TDD • Agentic Workflows • React • Node • Cloud Automation</text>
<text x="80" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#FFFFFF">&gt; READY<tspan><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>_</tspan></text>
<text x="890" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" xml:space="preserve" fill="#FFFFFF" opacity="0">     ( <animateTransform attributeName="transform" type="translate" values="0 6; 3 -4; -3 -14" dur="3.4s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="1.1s" repeatCount="indefinite"/></text><text x="890" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" xml:space="preserve" fill="#FFFFFF" opacity="0">    ( (<animateTransform attributeName="transform" type="translate" values="0 6; 4 -4; -4 -14" dur="2.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0s" repeatCount="indefinite"/></text><text x="890" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" xml:space="preserve" fill="#FFFFFF" opacity="0">     ) )<animateTransform attributeName="transform" type="translate" values="0 6; -3 -4; 3 -14" dur="3s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.6s" repeatCount="indefinite"/></text><text x="890" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" xml:space="preserve" fill="#FFFFFF">  ........</text><text x="890" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" xml:space="preserve" fill="#FFFFFF">  |      |]</text><text x="890" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" xml:space="preserve" fill="#FFFFFF">  \      /</text><text x="890" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" xml:space="preserve" fill="#FFFFFF">   `----'</text></g>
<rect x="22" y="16" width="1156" height="268" rx="44" fill="url(#scan)"/><rect x="22" y="16" width="1156" height="268" rx="44" fill="url(#vig)"/>
  </g>
</svg>
